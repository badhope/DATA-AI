[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-ai"
version = "2.0.1"
description = "Production-grade AI Agent Framework with multi-model support, RAG, memory, and tool calling"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Badhope", email = "badhope@github.com"}
]
keywords = ["ai", "agent", "llm", "rag", "openai", "anthropic", "tool-calling", "embeddings", "chromadb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "openai>=1.55.0",
    "tiktoken>=0.13.0",
    "tenacity>=9.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.2.2",
    "rich>=13.0.0",
    "typer>=0.15.0",
    "pyyaml>=6.0.0",
    "structlog>=24.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.20",
    "croniter>=3.0.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.109.1"]
google = ["google-generativeai>=0.8.6"]
chromadb = ["chromadb>=1.5.9"]
embeddings = ["sentence-transformers>=5.5.1"]
documents = [
    "PyPDF2>=3.0.1",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "pandas>=2.3.3",
]
vision = ["pillow>=12.2.0"]
browser = ["playwright>=1.60.0"]
api = ["fastapi>=0.115.0", "uvicorn>=0.30.0"]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-rerunfailures>=16.3",
    "ruff>=0.15.16",
]
all = [
    "anthropic>=0.109.1",
    "google-generativeai>=0.8.6",
    "chromadb>=1.5.9",
    "sentence-transformers>=5.5.1",
    "PyPDF2>=3.0.1",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "pandas>=2.3.3",
    "pillow>=12.2.0",
    "playwright>=1.60.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
data-ai = "data_ai.__main__:main"

[project.urls]
Homepage = "https://github.com/badhope/DATA-AI"
Repository = "https://github.com/badhope/DATA-AI"
Issues = "https://github.com/badhope/DATA-AI/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
# 项目惯例/已存在的合理情况：
# - ``__init__.py`` 中大量 SDK 重导出，未使用 import 是有意为之。
# - 模块级 ``import`` 紧跟 ``sys.path.insert`` 是为了让脚本在源码树下能直接跑。
# - 项目内自定义异常类名延续 ``XxxException`` 风格（不强制 Error 后缀）。
ignore = [
    "E501",  # 长行（项目历史原因保留）
    "E402",  # 模块级 import 紧随 sys.path.insert
    "N801",  # 第三方库 ``nullcontext`` 之类沿用 snake_case
    "N806",  # ``txBox`` / ``_ENV_PROVIDER_MAP`` 等约定名称
    "N814",  # ``_P`` / ``_TR`` 短别名
    "N818",  # 异常类名沿用 ``*Exception`` 风格
]
# ``__init__.py`` 的 re-export 不算未使用 import
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"src/data_ai/sdk/__init__.py" = ["F401", "UP035"]  # 对外 SDK 仍暴露 typing 别名
"src/data_ai/core/search/__init__.py" = ["UP035"]
"src/data_ai/plugins/__init__.py" = ["UP035"]
"src/data_ai/sandbox/__init__.py" = ["UP035"]
"src/data_ai/core/tool/office.py" = ["F401"]  # docx/pptx/openpyxl 均为可选依赖，按需 import
"src/data_ai/utils/encryption.py" = ["F401"]  # cryptography 为可选加密后端
"src/data_ai/cli/completer.py" = ["F401"]  # prompt_toolkit 为可选 CLI 增强
"tests/conftest.py" = ["E402", "F401"]
"scripts/check_system*.py" = ["E402"]
"web/**" = ["ALL"]

[tool.ruff.format]
quote-style = "double"
