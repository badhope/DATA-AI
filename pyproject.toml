[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-agent"
version = "0.9.3"
description = "Spark [Ember] — local-first coding agent with a Codex-style loop"
readme = "README.md"
license = { text = "MIT" }
keywords = ["ai", "agent", "coding", "local-first", "llm", "chatbot"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "chromadb>=1.0",
    "instructor>=1.4,<2.0",
    "litellm>=1.0,<2.0",
    "llama-index-core>=0.12,<1.0",
    "llama-index-llms-openai-like>=0.3,<1.0",
    "httpx>=0.27,<1.0",
    "langgraph>=0.3,<1.0",
    "langgraph-checkpoint-sqlite>=2.0,<4.0",
    "mcp>=1.0,<2.0; python_version>=\"3.10\"",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "textual>=0.80,<1.0",
    "tomlkit>=0.13,<1.0",
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-javascript>=0.23,<0.26",
    "tree-sitter-python>=0.23,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
    "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.7",
    "mypy>=1.11",
    "bandit>=1.7",
    "pre-commit>=3.6",
]
# P0-9: 观测（Langfuse 自托管 = OTLP 端点，spark 直接接入 OTLP 即可）
telemetry = [
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28",
]
# P1-5: 内置终端（真实 PTY）。Windows 不支持（需 winpty/ConPTY），
# 故用环境标记排除；未安装时 spark.pty 可导入但 PtyManager() 给出清晰报错。
pty = [
    "ptyprocess>=0.7; sys_platform != 'win32'",
]
desktop = [
    "pywebview>=5.0",
]

[project.scripts]
spark = "spark.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spark = ["prompts/*.md", "web/*.html", "web/dist/*", "web/dist/assets/*", "evals/data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E4",    # pycodestyle import errors
    "E7",    # pycodestyle statement errors
    "E9",    # pycodestyle runtime errors
    "F",     # pyflakes
    "I001",  # import sorting
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# search.py deliberately defers pydantic/spark imports to avoid a circular
# import at module load time.
"src/spark/tools/search.py" = ["E402"]
# 以下文件中 logger = logging.getLogger(__name__) 紧跟在 __future__ 与 stdlib
# 导入之后、第三方/本地导入之前，避免 E402 噪音。
"src/spark/core/graph.py" = ["E402"]
"src/spark/memory/service.py" = ["E402"]
"src/spark/tools/shell.py" = ["E402"]
"src/spark/tui/app.py" = ["E402"]
# routes.py 保持 import-light：pty 写路径在 _POST_HANDLERS 定义后就近懒加载，
# 不为 import 排序把 pty 依赖提到模块顶部。
"src/spark/web/routes.py" = ["E402", "I001"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "llama_index.*",
    "langgraph.*",
    "litellm.*",
    "textual.*",
    "typer.*",
]
ignore_missing_imports = true
follow_imports = "skip"
