<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5eead4"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="980" height="300" fill="#0f1419"/>
  <text x="20" y="28" fill="#e7ecf3" font-size="14" font-weight="700">单回合执行流（turn）</text>

  <!-- user -->
  <rect x="20" y="56" width="110" height="44" rx="10" fill="#16233a" stroke="#2b4a7a"/>
  <text x="75" y="82" text-anchor="middle" fill="#7fb3ff" font-size="12" font-weight="700">用户输入</text>

  <line x1="130" y1="78" x2="170" y2="78" stroke="#5eead4" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- compact check -->
  <path d="M172 56 h100 l14 22 l-14 22 h-100 z" fill="#2a1f3d" stroke="#4a3a6b"/>
  <text x="228" y="72" text-anchor="middle" fill="#c4a8ff" font-size="11" font-weight="700">上下文</text>
  <text x="228" y="88" text-anchor="middle" fill="#9c8fc0" font-size="10">≥85% 自动压缩</text>

  <line x1="286" y1="78" x2="326" y2="78" stroke="#fbbf24" stroke-width="1.6" marker-end="url(#arrA)"/>

  <!-- memory -->
  <rect x="328" y="56" width="120" height="44" rx="10" fill="#3a2c14" stroke="#5c4a1d"/>
  <text x="388" y="72" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">记忆检索</text>
  <text x="388" y="88" text-anchor="middle" fill="#9c8a60" font-size="10">嵌入 / 关键词降级</text>

  <line x1="448" y1="78" x2="488" y2="78" stroke="#5eead4" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- model -->
  <rect x="490" y="46" width="150" height="64" rx="10" fill="#123b35" stroke="#2c5c52"/>
  <text x="565" y="70" text-anchor="middle" fill="#99f6e4" font-size="12" font-weight="700">模型推理（流式）</text>
  <text x="565" y="90" text-anchor="middle" fill="#8b9bb4" font-size="10">text_delta · reasoning_delta</text>

  <!-- branch: tool calls -->
  <line x1="640" y1="64" x2="700" y2="64" stroke="#5eead4" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="672" y="56" text-anchor="middle" fill="#5eead4" font-size="10">有工具</text>
  <rect x="702" y="42" width="130" height="44" rx="10" fill="#3a2c14" stroke="#5c4a1d"/>
  <text x="767" y="60" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="700">工具执行</text>
  <text x="767" y="76" text-anchor="middle" fill="#9c8a60" font-size="10">沙箱 + 审批策略</text>

  <line x1="832" y1="56" x2="880" y2="56" stroke="#fbbf24" stroke-width="1.6" marker-end="url(#arrA)"/>
  <text x="884" y="60" fill="#fbbf24" font-size="10">tool_result</text>
  <path d="M884 70 Q960 70 960 150 Q960 176 565 176" fill="none" stroke="#fbbf24" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrA)"/>
  <text x="900" y="168" fill="#9c8a60" font-size="10">回到模型（多轮工具循环，≤ max_tool_rounds）</text>

  <!-- branch: final answer -->
  <line x1="640" y1="96" x2="700" y2="96" stroke="#5eead4" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="672" y="88" text-anchor="middle" fill="#5eead4" font-size="10">无工具</text>
  <rect x="702" y="76" width="130" height="44" rx="10" fill="#123b35" stroke="#2c5c52"/>
  <text x="767" y="94" text-anchor="middle" fill="#99f6e4" font-size="11" font-weight="700">输出完成</text>
  <text x="767" y="110" text-anchor="middle" fill="#8b9bb4" font-size="10">turn_end</text>

  <line x1="767" y1="120" x2="767" y2="150" stroke="#5eead4" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="660" y="150" width="215" height="44" rx="10" fill="#2a1f3d" stroke="#4a3a6b"/>
  <text x="767" y="168" text-anchor="middle" fill="#c4a8ff" font-size="11" font-weight="700">落库 + 自动检查点</text>
  <text x="767" y="184" text-anchor="middle" fill="#9c8fc0" font-size="10">write/shell 类回合打快照</text>

  <!-- side: subagent / bg -->
  <rect x="20" y="150" width="210" height="52" rx="10" fill="#171025" stroke="#5a4880"/>
  <text x="125" y="170" text-anchor="middle" fill="#e9defc" font-size="11" font-weight="700">Task 并行子 Agent（×4）</text>
  <text x="125" y="188" text-anchor="middle" fill="#9c8fc0" font-size="10">独立 store · 事件实时转发</text>
  <rect x="250" y="150" width="210" height="52" rx="10" fill="#171025" stroke="#5a4880"/>
  <text x="355" y="170" text-anchor="middle" fill="#e9defc" font-size="11" font-weight="700">bg_* 后台任务</text>
  <text x="355" y="188" text-anchor="middle" fill="#9c8fc0" font-size="10">进程组信号 · 输出 200K 截断</text>

  <line x1="565" y1="110" x2="470" y2="150" stroke="#5a4880" stroke-width="1.3" stroke-dasharray="4 4"/>
  <line x1="565" y1="110" x2="460" y2="162" stroke="#5a4880" stroke-width="1.3" stroke-dasharray="4 4"/>

  <!-- footer -->
  <text x="20" y="260" fill="#8b9bb4" font-size="11">事件经 SSE 实时推送到前端：text_delta · reasoning_delta · tool_start/end · plan · approval_needed · compaction · context · turn_end</text>
</svg>
