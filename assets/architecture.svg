<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <linearGradient id="g-teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123b35"/>
      <stop offset="1" stop-color="#0c1f1c"/>
    </linearGradient>
    <linearGradient id="g-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16233a"/>
      <stop offset="1" stop-color="#0e1830"/>
    </linearGradient>
    <linearGradient id="g-amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2c14"/>
      <stop offset="1" stop-color="#241c0d"/>
    </linearGradient>
    <linearGradient id="g-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1f3d"/>
      <stop offset="1" stop-color="#171025"/>
    </linearGradient>
    <linearGradient id="g-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1620"/>
      <stop offset="1" stop-color="#200a10"/>
    </linearGradient>
  </defs>

  <rect width="980" height="620" fill="#0f1419"/>

  <!-- ===== 前端层 ===== -->
  <rect x="20" y="20" width="940" height="110" rx="14" fill="url(#g-blue)" stroke="#2b4a7a" stroke-width="1.2"/>
  <text x="40" y="48" fill="#7fb3ff" font-size="13" font-weight="700">前端 · React 19 + Vite + Tailwind（手机 / 桌面自适应）</text>
  <g font-size="11.5" fill="#c9d6ea">
    <rect x="40" y="62" width="140" height="48" rx="9" fill="#0e1830" stroke="#33517f"/>
    <text x="110" y="82" text-anchor="middle">会话侧栏</text>
    <text x="110" y="98" text-anchor="middle" fill="#8b9bb4" font-size="10">CRUD · 关键词</text>
    <rect x="192" y="62" width="140" height="48" rx="9" fill="#0e1830" stroke="#33517f"/>
    <text x="262" y="82" text-anchor="middle">流式消息区</text>
    <text x="262" y="98" text-anchor="middle" fill="#8b9bb4" font-size="10">Markdown · 工具块</text>
    <rect x="344" y="62" width="140" height="48" rx="9" fill="#0e1830" stroke="#33517f"/>
    <text x="414" y="82" text-anchor="middle">Plan / 审批卡</text>
    <text x="414" y="98" text-anchor="middle" fill="#8b9bb4" font-size="10">步骤 · 确认流</text>
    <rect x="496" y="62" width="140" height="48" rx="9" fill="#0e1830" stroke="#33517f"/>
    <text x="566" y="82" text-anchor="middle">检查点回滚</text>
    <text x="566" y="98" text-anchor="middle" fill="#8b9bb4" font-size="10">时间线 · 恢复</text>
    <rect x="648" y="62" width="140" height="48" rx="9" fill="#0e1830" stroke="#33517f"/>
    <text x="718" y="82" text-anchor="middle">设置面板</text>
    <text x="718" y="98" text-anchor="middle" fill="#8b9bb4" font-size="10">模型 · 权限 · MCP</text>
    <rect x="800" y="62" width="140" height="48" rx="9" fill="#0e1830" stroke="#33517f"/>
    <text x="870" y="82" text-anchor="middle">上下文仪表</text>
    <text x="870" y="98" text-anchor="middle" fill="#8b9bb4" font-size="10">token 水位</text>
  </g>

  <!-- SSE / REST 通道 -->
  <line x1="490" y1="130" x2="490" y2="164" stroke="#5eead4" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="500" y="150" fill="#5eead4" font-size="11.5" font-weight="600">SSE 事件流 / REST JSON（ThreadingHTTPServer，零框架依赖）</text>

  <!-- ===== 后端 ===== -->
  <rect x="20" y="164" width="940" height="150" rx="14" fill="url(#g-teal)" stroke="#1d4a43" stroke-width="1.2"/>
  <text x="40" y="192" fill="#5eead4" font-size="13" font-weight="700">后端 · Python（stdlib http.server）</text>
  <g font-size="11.5" fill="#c9d6ea">
    <rect x="40" y="206" width="215" height="88" rx="9" fill="#0c1f1c" stroke="#2c5c52"/>
    <text x="147" y="230" text-anchor="middle" font-weight="700" fill="#99f6e4">/api/chat/stream</text>
    <text x="147" y="250" text-anchor="middle" fill="#8b9bb4" font-size="10">SSE 逐 token 推送</text>
    <text x="147" y="266" text-anchor="middle" fill="#8b9bb4" font-size="10">text / tool / plan / approval</text>
    <rect x="267" y="206" width="215" height="88" rx="9" fill="#0c1f1c" stroke="#2c5c52"/>
    <text x="374" y="230" text-anchor="middle" font-weight="700" fill="#99f6e4">会话 / 检查点 API</text>
    <text x="374" y="250" text-anchor="middle" fill="#8b9bb4" font-size="10">sessions · checkpoints/rollback</text>
    <text x="374" y="266" text-anchor="middle" fill="#8b9bb4" font-size="10">history · memory · agents_md</text>
    <rect x="494" y="206" width="215" height="88" rx="9" fill="#0c1f1c" stroke="#2c5c52"/>
    <text x="601" y="230" text-anchor="middle" font-weight="700" fill="#99f6e4">模型档案 API</text>
    <text x="601" y="250" text-anchor="middle" fill="#8b9bb4" font-size="10">models/save · activate · delete</text>
    <text x="601" y="266" text-anchor="middle" fill="#8b9bb4" font-size="10">settings · test（连通性探测）</text>
    <rect x="721" y="206" width="219" height="88" rx="9" fill="#0c1f1c" stroke="#2c5c52"/>
    <text x="830" y="230" text-anchor="middle" font-weight="700" fill="#99f6e4">审批 / 取消 / 状态</text>
    <text x="830" y="250" text-anchor="middle" fill="#8b9bb4" font-size="10">approval 队列 · cancel</text>
    <text x="830" y="266" text-anchor="middle" fill="#8b9bb4" font-size="10">status（含 display 开关）</text>
  </g>

  <!-- ===== Agent 核心 ===== -->
  <rect x="20" y="330" width="940" height="180" rx="14" fill="url(#g-purple)" stroke="#4a3a6b" stroke-width="1.2"/>
  <text x="40" y="358" fill="#c4a8ff" font-size="13" font-weight="700">Agent 核心 · AgentLoop（Codex 式回合引擎）</text>
  <g font-size="11.5" fill="#d8ccec">
    <rect x="40" y="372" width="215" height="118" rx="9" fill="#171025" stroke="#5a4880"/>
    <text x="147" y="396" text-anchor="middle" font-weight="700" fill="#e9defc">上下文引擎</text>
    <text x="147" y="416" text-anchor="middle" fill="#9c8fc0" font-size="10">AGENTS.md 注入</text>
    <text x="147" y="432" text-anchor="middle" fill="#9c8fc0" font-size="10">长期记忆检索（嵌入/关键词）</text>
    <text x="147" y="448" text-anchor="middle" fill="#9c8fc0" font-size="10">8 段式自动压缩（85% 触发）</text>
    <text x="147" y="464" text-anchor="middle" fill="#9c8fc0" font-size="10">token 水位估算</text>
    <rect x="267" y="372" width="215" height="118" rx="9" fill="#171025" stroke="#5a4880"/>
    <text x="374" y="396" text-anchor="middle" font-weight="700" fill="#e9defc">工具执行</text>
    <text x="374" y="416" text-anchor="middle" fill="#9c8fc0" font-size="10">审批策略（suggest / full-auto）</text>
    <text x="374" y="432" text-anchor="middle" fill="#9c8fc0" font-size="10">Task 子 Agent（并行 ×4）</text>
    <text x="374" y="448" text-anchor="middle" fill="#9c8fc0" font-size="10">bg_* 后台任务（进程组信号）</text>
    <text x="374" y="464" text-anchor="middle" fill="#9c8fc0" font-size="10">MCP 工具桥接</text>
    <rect x="494" y="372" width="215" height="118" rx="9" fill="#171025" stroke="#5a4880"/>
    <text x="601" y="396" text-anchor="middle" font-weight="700" fill="#e9defc">沙箱四档</text>
    <text x="601" y="416" text-anchor="middle" fill="#9c8fc0" font-size="10">sandbox-only · workspace</text>
    <text x="601" y="432" text-anchor="middle" fill="#9c8fc0" font-size="10">full-access · unrestricted</text>
    <text x="601" y="448" text-anchor="middle" fill="#9c8fc0" font-size="10">默认保护 Spark 自身</text>
    <text x="601" y="464" text-anchor="middle" fill="#9c8fc0" font-size="10">shell 命令 token 级扫描</text>
    <rect x="721" y="372" width="219" height="118" rx="9" fill="#171025" stroke="#5a4880"/>
    <text x="830" y="396" text-anchor="middle" font-weight="700" fill="#e9defc">持久化</text>
    <text x="830" y="416" text-anchor="middle" fill="#9c8fc0" font-size="10">SQLite：会话 / 消息 / 检查点</text>
    <text x="830" y="432" text-anchor="middle" fill="#9c8fc0" font-size="10">tar.gz 工作区快照</text>
    <text x="830" y="448" text-anchor="middle" fill="#9c8fc0" font-size="10">记忆库（.memory）</text>
    <text x="830" y="464" text-anchor="middle" fill="#9c8fc0" font-size="10">~/.spark/config.toml</text>
  </g>

  <!-- ===== 能力层 ===== -->
  <rect x="20" y="526" width="940" height="76" rx="14" fill="url(#g-amber)" stroke="#5c4a1d" stroke-width="1.2"/>
  <text x="40" y="552" fill="#fbbf24" font-size="13" font-weight="700">能力层</text>
  <g font-size="11" fill="#d9c9a3">
    <rect x="110" y="538" width="150" height="44" rx="8" fill="#241c0d" stroke="#6b5619"/>
    <text x="185" y="557" text-anchor="middle">OpenAI 兼容 Provider</text>
    <text x="185" y="572" text-anchor="middle" fill="#9c8a60" font-size="9.5">多模型档案 · Reasoning</text>
    <rect x="272" y="538" width="150" height="44" rx="8" fill="#241c0d" stroke="#6b5619"/>
    <text x="347" y="557" text-anchor="middle">内置工具集</text>
    <text x="347" y="572" text-anchor="middle" fill="#9c8a60" font-size="9.5">fs / shell / grep / Jupyter</text>
    <rect x="434" y="538" width="150" height="44" rx="8" fill="#241c0d" stroke="#6b5619"/>
    <text x="509" y="557" text-anchor="middle">联网检索</text>
    <text x="509" y="572" text-anchor="middle" fill="#9c8a60" font-size="9.5">Bing search · web_fetch</text>
    <rect x="596" y="538" width="150" height="44" rx="8" fill="#241c0d" stroke="#6b5619"/>
    <text x="671" y="557" text-anchor="middle">MCP 服务器</text>
    <text x="671" y="572" text-anchor="middle" fill="#9c8a60" font-size="9.5">stdio 桥接 · 只读白名单</text>
    <rect x="758" y="538" width="150" height="44" rx="8" fill="#241c0d" stroke="#6b5619"/>
    <text x="833" y="557" text-anchor="middle">长期记忆</text>
    <text x="833" y="572" text-anchor="middle" fill="#9c8a60" font-size="9.5">LLM 抽取 · 语义检索</text>
  </g>

  <!-- 层间连线 -->
  <line x1="490" y1="314" x2="490" y2="330" stroke="#5eead4" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="490" y1="510" x2="490" y2="526" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="5 4"/>
</svg>
