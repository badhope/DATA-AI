name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v6.0.3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Smoke import the server
        run: |
          PYTHONPATH=src python -c "import data_ai.core.api.server; assert len(data_ai.core.api.server.app.routes) > 30"

      - name: Lint with ruff
        run: |
          ruff check src/ tests/

      - name: Format check with ruff
        run: |
          ruff format --check src/ tests/

      - name: Run unit tests
        env:
          DATA_AI_API_KEYS: "ci-test-key"
        run: |
          pytest tests/unit/ -v --tb=short \
            --reruns 2 --reruns-delay 1 \
            -m "not slow"

      - name: Run full test suite
        env:
          DATA_AI_API_KEYS: "ci-test-key"
        run: |
          pytest tests/ -v --tb=short \
            --reruns 2 --reruns-delay 1 \
            -m "not slow"

  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20']

    steps:
      - uses: actions/checkout@v6.0.3

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci || npm install

      - name: TypeScript type check
        working-directory: web
        run: npx tsc -b --noEmit

      - name: Build
        working-directory: web
        run: npm run build

  build-package:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    needs: [backend-test, frontend]
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check the built artifacts
        run: |
          python -m pip install twine
          twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
