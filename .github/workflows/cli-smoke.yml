name: CLI Smoke (live data)

on:
  workflow_dispatch:
    inputs:
      data_version:
        description: "DATA image tag to test against (e.g. 1.7.0)"
        type: string
        required: true
      cli_ref:
        description: "Git ref to build the cli from (default: current branch)"
        type: string
        required: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout cli ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.cli_ref || github.ref }}
          persist-credentials: false

      - name: Setup web environment
        uses: ./.github/actions/setup-web

      - name: Bring up data
        env:
          DATA_VERSION: ${{ inputs.data_version }}
        run: |
          cd docker
          cp .env.example .env
          DATA_API_IMAGE_TAG="$DATA_VERSION" \
          DATA_WEB_IMAGE_TAG="$DATA_VERSION" \
          docker compose up -d api worker web db redis
          for i in $(seq 1 60); do
              if curl -fsS http://localhost:5001/health >/dev/null 2>&1; then
                  echo "data api ready after ${i}s"
                  break
              fi
              sleep 1
          done

      - name: Run smoke against live data
        working-directory: ./cli
        run: pnpm exec tsx scripts/run-smoke.ts --base-url http://localhost:5001

      - name: Dump data logs on failure
        if: failure()
        run: |
          cd docker
          docker compose logs api worker web --tail=200
