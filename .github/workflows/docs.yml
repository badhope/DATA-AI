name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  spellcheck:
    name: Spell check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 直接 pip install codespell 而非依赖第三方 action, 避免 GitHub 找不到
      # ``codespell-project/actions`` 仓库路径导致 "repository not found"。
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install codespell
        run: pip install --quiet codespell

      - name: Run codespell
        run: |
          codespell \
            --ignore-words-list="lits,rouge,connexion,re-use,re-used,re-using,re-use,referer,aks,fo,ue,ba,roth,statics,distrib,datas,hist,hte,ist" \
            --skip=".git,node_modules,dist,build,.venv,web/dist,web/node_modules,*.lock,uv.lock,package-lock.json,__pycache__,data,scripts/_*.py,docs/DEPENDENCIES.md"

  link-check:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # 新版 lychee 默认不扫 mail, 删 ``--exclude-mail``; 命名也用 camelCase ``lycheeVersion``。
          args: --no-progress --accept 200,206,301,302,403 --exclude-loopback
          fail: true
          lycheeVersion: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
