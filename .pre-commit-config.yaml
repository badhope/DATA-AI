repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: no-commit-to-branch
        args: ["--branch=main", "--branch=master"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [markdown, yaml, json]
        additional_dependencies:
          - prettier@3.3.3

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: forbid-cursor-files
        name: forbid temporary _wrap_*.py / _fix_*.py helpers
        entry: bash -c 'git ls-files | grep -E "(^|/)(_[a-z_]+\.py)$" | grep -E "(wrap_module_body|fix_broken_conversion|clean_convert_p0p1|convert_test_module_exec|final_cleanup_p0p1|fix_e2e_smoke|fix_p0_4_rag_fileread|lift_future_import)\.py$" && echo "✗ temporary helper scripts must not be committed" && exit 1 || exit 0'
        language: system
        pass_filenames: false
        types: [python]
