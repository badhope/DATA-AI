[project]
name = "data-vdb-tidb-vector"
version = "0.0.1"

dependencies = [
    "tidb-vector==0.0.15",
]
description = "DATA vector store backend (data-vdb-tidb-vector)."

[project.entry-points."data.vector_backends"]
tidb_vector = "data_vdb_tidb_vector.tidb_vector:TiDBVectorFactory"

[tool.setuptools.packages.find]
where = ["src"]
