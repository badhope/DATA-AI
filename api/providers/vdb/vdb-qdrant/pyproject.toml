[project]
name = "data-vdb-qdrant"
version = "0.0.1"

dependencies = [
    "qdrant-client==1.9.0",
]
description = "DATA vector store backend (data-vdb-qdrant)."

[project.entry-points."data.vector_backends"]
qdrant = "data_vdb_qdrant.qdrant_vector:QdrantVectorFactory"

[tool.setuptools.packages.find]
where = ["src"]
