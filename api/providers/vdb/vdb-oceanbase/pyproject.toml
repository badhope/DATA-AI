[project]
name = "data-vdb-oceanbase"
version = "0.0.1"

dependencies = [
    "pyobvector==0.2.25",
    "mysql-connector-python>=9.3.0,<10.0.0",
]
description = "DATA vector store backend (data-vdb-oceanbase)."

[project.entry-points."data.vector_backends"]
oceanbase = "data_vdb_oceanbase.oceanbase_vector:OceanBaseVectorFactory"
seekdb = "data_vdb_oceanbase.oceanbase_vector:OceanBaseVectorFactory"

[tool.setuptools.packages.find]
where = ["src"]
