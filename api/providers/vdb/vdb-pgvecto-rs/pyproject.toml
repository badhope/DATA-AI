[project]
name = "data-vdb-pgvecto-rs"
version = "0.0.1"

dependencies = [
    "pgvecto-rs[sqlalchemy]==0.2.2",
]
description = "DATA vector store backend (data-vdb-pgvecto-rs)."

[project.entry-points."data.vector_backends"]
pgvecto-rs = "data_vdb_pgvecto_rs.pgvecto_rs:PGVectoRSFactory"

[tool.setuptools.packages.find]
where = ["src"]
