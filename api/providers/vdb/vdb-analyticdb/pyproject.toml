[project]
name = "data-vdb-analyticdb"
version = "0.0.1"
dependencies = [
    "alibabacloud_gpdb20160503~=5.2.0",
    "alibabacloud_tea_openapi==0.4.4",
    "clickhouse-connect==0.15.1",
]
description = "DATA vector store backend (data-vdb-analyticdb)."

[project.entry-points."data.vector_backends"]
analyticdb = "data_vdb_analyticdb.analyticdb_vector:AnalyticdbVectorFactory"

[tool.setuptools.packages.find]
where = ["src"]
