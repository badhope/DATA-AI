    "data-vdb-oracle",
    "data-vdb-pgvecto-rs",
    "data-vdb-pgvector",
    "data-vdb-qdrant",
    "data-vdb-relyt",
    "data-vdb-tablestore",
    "data-vdb-tencent",
    "data-vdb-tidb-on-qdrant",
    "data-vdb-tidb-vector",
    "data-vdb-upstash",
    "data-vdb-vastbase",
    "data-vdb-vikingdb",
    "data-vdb-weaviate",
]
vdb-alibabacloud-mysql = ["data-vdb-alibabacloud-mysql"]
vdb-analyticdb = ["data-vdb-analyticdb"]
vdb-baidu = ["data-vdb-baidu"]
vdb-chroma = ["data-vdb-chroma"]
vdb-clickzetta = ["data-vdb-clickzetta"]
vdb-couchbase = ["data-vdb-couchbase"]
vdb-elasticsearch = ["data-vdb-elasticsearch"]
vdb-hologres = ["data-vdb-hologres"]
vdb-huawei-cloud = ["data-vdb-huawei-cloud"]
vdb-iris = ["data-vdb-iris"]
vdb-lindorm = ["data-vdb-lindorm"]
vdb-matrixone = ["data-vdb-matrixone"]
vdb-milvus = ["data-vdb-milvus"]
vdb-myscale = ["data-vdb-myscale"]
vdb-oceanbase = ["data-vdb-oceanbase"]
vdb-opengauss = ["data-vdb-opengauss"]
vdb-opensearch = ["data-vdb-opensearch"]
