trace-all = [
    "data-trace-aliyun",
    "data-trace-arize-phoenix",
    "data-trace-langfuse",
    "data-trace-langsmith",
    "data-trace-mlflow",
    "data-trace-opik",
    "data-trace-tencent",
    "data-trace-weave",
